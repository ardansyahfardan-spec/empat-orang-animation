name: Render episode MP4
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'render/**'
      - '.github/workflows/render.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Render frames and encode MP4
        run: |
          mkdir -p output
          node render/render.mjs
          ffmpeg -y -framerate 30 -i output/frame-%05d.png -c:v libx264 -pix_fmt yuv420p -r 30 -movflags +faststart output/empat-orang-ep01.mp4
      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: empat-orang-episode-01-mp4
          path: output/empat-orang-ep01.mp4
          retention-days: 30
