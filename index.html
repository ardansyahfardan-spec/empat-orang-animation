<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#090b10"><title>EMPAT ORANG — Rumah yang Memanggil</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#090b10;color:#f3eee6;font-family:Georgia,serif}body{display:grid;place-items:center;overflow:hidden}.app{width:min(100vw,56.25vh);height:min(100dvh,177.78vw);display:flex;flex-direction:column;background:#10131a;position:relative}.stage{position:relative;flex:1;min-height:0;background:#080b12;overflow:hidden}canvas{display:block;width:100%;height:100%}.overlay{position:absolute;inset:0;display:flex;align-items:end;justify-content:center;padding:8% 7%;pointer-events:none;background:linear-gradient(transparent 45%,#05070bdc)}.caption{font-size:clamp(15px,3.7vw,23px);line-height:1.35;text-align:center;text-shadow:0 2px 8px #000;max-width:95%;min-height:3em}.hud{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#11151d;font:12px system-ui;color:#c9c3b9;gap:8px}.controls{display:flex;gap:8px}.controls button{border:1px solid #55515a;border-radius:30px;padding:9px 14px;background:#202530;color:#f3eee6;font-weight:600}.pill{font:10px system-ui;letter-spacing:.22em;color:#d2b995;text-transform:uppercase}.note{font:10px system-ui;opacity:.65;text-align:center;padding:0 8px}
</style></head><body><main class="app"><section class="stage"><canvas id="screen" width="540" height="960"></canvas><div class="overlay"><div class="caption" id="caption"></div></div></section><footer class="hud"><div><div class="pill">EMPAT ORANG</div><div id="clock">00:00 / 01:32</div></div><div class="controls"><button id="play">▶ Putar</button><button id="restart">↺ Ulang</button></div></footer><div class="note">Episode 01 · Rumah yang Memanggil · Pratinjau animasi 2D</div></main>
<script>
(()=>{const c=document.getElementById('screen'),x=c.getContext('2d'),cap=document.getElementById('caption'),clock=document.getElementById('clock'),play=document.getElementById('play');const W=540,H=960,D=92;let start=0,paused=0,raf=0;
const scenes=[[0,8,'EMPAT ORANG','Rumah yang Memanggil','title'],[8,19,'Malam itu, mereka melewati sebuah rumah tua di ujung jalan.','Tidak ada lampu. Tidak ada suara.','road'],[19,31,'“Kalian dengar itu?”','Sebuah suara memanggil dari balik pagar.','group'],[31,43,'“Ardan...”','Suara itu terdengar seperti seseorang yang sangat mengenalnya.','window'],[43,55,'“Jangan dijawab.”','Bila menarik lengan Ardan.','close'],[55,68,'Dari lantai dua, sebuah bayangan bergerak.','Padahal rumah itu sudah lama kosong.','ghost'],[68,81,'Pintu depan terbuka perlahan.','Tidak ada seorang pun di sana.','door'],[81,92,'“Akhirnya... kalian pulang.”','BERSAMBUNG','end']];
function rect(a,b,w,h,col){x.fillStyle=col;x.fillRect(a,b,w,h)}function line(a,b,d,e,col,l=2){x.strokeStyle=col;x.lineWidth=l;x.beginPath();x.moveTo(a,b);x.lineTo(d,e);x.stroke()}
function person(px,py,s,kind,t){x.save();x.translate(px,py);x.scale(s,s);x.translate(0,Math.sin(t*2+px)*3);x.fillStyle='#10131a';x.beginPath();x.ellipse(0,0,27,12,0,0,7);x.fill();x.fillStyle=['#252a34','#4b4650','#343b48','#181b22'][kind];x.beginPath();x.moveTo(-20,-12);x.lineTo(-17,-73);x.quadraticCurveTo(0,-87,17,-73);x.lineTo(22,-12);x.closePath();x.fill();x.fillStyle=kind===1||kind===2?'#171922':'#a77e66';x.beginPath();x.arc(0,-91,kind===1||kind===2?17:16,0,Math.PI*2);x.fill();if(kind===1||kind===2){x.fillStyle='#26232b';x.beginPath();x.arc(0,-96,19,Math.PI,Math.PI*2);x.lineTo(19,-76);x.quadraticCurveTo(0,-66,-19,-76);x.closePath();x.fill()}else rect(-13,-108,26,7,'#171922');if(kind===0){x.fillStyle='#b9a17d';x.beginPath();x.arc(17,-88,3,0,7);x.fill()}x.restore()}
function draw(t){let s=scenes.find(z=>t>=z[0]&&t<z[1])||scenes[7];cap.innerHTML=s[2]==='EMPAT ORANG'?'<span style="letter-spacing:.18em">EMPAT ORANG</span><br><small style="font-size:.58em;letter-spacing:.1em">RUMAH YANG MEMANGGIL</small>':s[2]+'<br><small style="font-size:.7em;opacity:.8">'+s[3]+'</small>';clock.textContent=new Date(t*1000).toISOString().slice(14,19)+' / 01:32';let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#101725');g.addColorStop(.6,'#20202a');g.addColorStop(1,'#080a10');rect(0,0,W,H,g);let moon=x.createRadialGradient(420,155,4,420,155,145);moon.addColorStop(0,'#b9c3c0');moon.addColorStop(.18,'#65717b');moon.addColorStop(1,'#18202a00');x.fillStyle=moon;x.fillRect(250,0,290,330);
if(s[4]==='title'){rect(0,0,W,H,'#090d15');for(let i=0;i<22;i++){rect((i*97)%W,(i*173)%H,2,2,'#9ca8b2')}rect(90,380,360,390,'#171b24');rect(120,430,125,160,'#080b12');rect(295,430,125,160,'#080b12')}
else if(s[4]==='road'||s[4]==='group'){rect(0,580,W,380,'#11151b');for(let i=0;i<7;i++)line(i*100-40,580,i*100-150,960,'#292b31',3);rect(115,345,310,300,'#161922');rect(145,405,95,130,'#090d14');rect(295,405,95,130,'#090d14');if(s[4]==='group'){person(155,780,1.05,0,t);person(245,790,.95,1,t);person(330,775,1.08,2,t);person(420,790,1.08,3,t)}}
else{rect(80,310,380,500,'#151923');rect(115,355,135,165,'#060910');rect(290,355,135,165,'#070910');rect(250,310,38,500,'#0c1018');if(s[4]==='window'||s[4]==='ghost'){rect(300,360,110,155,'#4b4c50');rect(305,365,100,145,'#090b11');if(s[4]==='ghost'){x.globalAlpha=.6+Math.sin(t*4)*.15;x.fillStyle='#c4c4bb';x.beginPath();x.ellipse(355,450,24,43,0,0,7);x.fill();x.globalAlpha=1}}if(s[4]==='door'){x.save();x.translate(250,580);x.rotate(-((t-68)/13)*1.2);rect(0,-220,140,440,'#252630');x.restore()}if(s[4]==='close'||s[4]==='end'){person(145,790,1.2,0,t);person(245,800,1.05,1,t);person(335,790,1.2,2,t);person(430,800,1.2,3,t)}}
for(let i=0;i<26;i++){x.fillStyle='rgba(190,196,202,.12)';x.fillRect((i*83+t*7)%W,(i*131+t*11)%H,2,2)}let v=x.createRadialGradient(270,450,160,270,450,590);v.addColorStop(0,'#0000');v.addColorStop(1,'#000b12');x.fillStyle=v;x.fillRect(0,0,W,H)}
function frame(now){if(!start)start=now-paused*1000;let t=Math.min(D,(now-start)/1000);draw(t);if(t>=D){paused=D;play.textContent='▶ Putar lagi';raf=0;return}raf=requestAnimationFrame(frame)}
play.onclick=()=>{if(paused>=D){paused=0;start=0}if(raf){cancelAnimationFrame(raf);raf=0;paused=Math.max(0,(performance.now()-start)/1000);play.textContent='▶ Lanjut'}else{play.textContent='Ⅱ Jeda';raf=requestAnimationFrame(frame)}};
document.getElementById('restart').onclick=()=>{if(raf)cancelAnimationFrame(raf);raf=0;start=0;paused=0;play.textContent='Ⅱ Jeda';raf=requestAnimationFrame(frame)};
draw(0);window.renderFrame=(seconds)=>draw(Math.max(0,Math.min(D,seconds)));window.EPISODE_DURATION=D;
})();
</script></body></html>
