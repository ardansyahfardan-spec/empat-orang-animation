function makeChar(id,x,z){
 const root=new THREE.Group();scene.add(root);root.position.set(x,0,z);
 const skin=mat(0xb9826b),dark=mat(id===0?0x292125:0x16191f),shirt=mat([0x3d4653,0x6b514b,0x414653,0x171a20][id]),pants=mat([0x20242c,0x29242a,0x252832,0x20232a][id]);

 sphere(.34,skin,0,0,0,.88,1.08,.85,head);
 if(id===1||id===2){
   const hijab=mat(id===1?0x28272d:0x49434a);
   sphere(.385,hijab,0,.08,-.035,1.04,1.14,.92,head);

   const drape=mesh(new THREE.CapsuleGeometry(.35,.62,5,10),hijab,0,-.48,-.02,head);drape.scale.set(1.12,1,.82);
 }else{
   const hair=mat(id===0?0x211b1b:0x15171c);sphere(.35,hair,0,.22,-.02,1.02,.58,.94,head);
   if(id===0){const side=mesh(new THREE.BoxGeometry(.12,.36,.2),hair,-.27,.02,.03,head);side.rotation.z=-.2;sphere(.035,M.white,.32,-.05,.28,1,1,1,head)}
 }
 // Eyes and facial detail
 for(const ex of [-.105,.105])sphere(.026,M.black,ex,-.02,.285,1,1,.6,head);

 const legs=[];for(const side of [-1,1]){const leg=mesh(new THREE.CapsuleGeometry(.14,.66,4,8),pants,side*.18,.48,0,root);legs.push(leg);box(.18,.12,.34,M.black,side*.18,.08,.08,root)}
 // Tio's band tee print and earrings; Bila shorter; Yhola taller/slim; Ardan black tee
 if(id===0){box(.28,.12,.018,M.white,0,1.48,.23,root)}
 root.scale.setScalar(id===1?.88:id===2?1.04:1);
 const c={root,head,arms,legs,id,baseX:x,baseZ:z};chars.push(c);return c;

const shots=[
[0,4,'EMPAT ORANG','RUMAH YANG MEMANGGIL','title','establish'],
[4,9,'Malam itu, jalan desa sudah sepi.','Hanya suara jangkrik menemani.','village','crane'],
[9,13,'Mereka berempat berjalan pulang.','','walk','tracking'],

];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),ease=v=>{v=clamp(v,0,1);return v*v*(3-2*v)},mix=(a,b,t)=>a+(b-a)*t;
function cameraAt(pos,target,fov=42){camera.position.set(...pos);camera.fov=fov;camera.updateProjectionMatrix();camera.lookAt(...target)}
function updateCharacters(t,kind,local){
 chars.forEach((c,i)=>{const walk=['walk','groupfear','ardanrun'].includes(kind);const ph=t*7+i*1.5;c.root.position.y=walk?Math.abs(Math.sin(ph))*.045:0;c.legs.forEach((l,j)=>{l.rotation.x=walk?Math.sin(ph+j*Math.PI)*.48:0});c.arms.forEach((a,j)=>{a.rotation.x=walk?Math.sin(ph+j*Math.PI+Math.PI)*.42:0});c.head.rotation.y=(kind==='tio'||kind==='bila'||kind==='yhola'||kind==='ardan')?Math.sin(local*3)*.12:0});

 if(kind==='ardanrun'){const a=chars[3];a.root.position.z=3+local*4}
}
function renderFrame(seconds){
 const s=shots.find(z=>seconds>=z[0]&&seconds<z[1])||shots.at(-1),idx=shots.indexOf(s),local=(seconds-s[0])/(s[1]-s[0]),kind=s[4],t=seconds;
 cap.innerHTML=s[2]==='EMPAT ORANG'?'<span style="letter-spacing:.18em">EMPAT ORANG</span><br><small style="font-size:.58em;letter-spacing:.1em">RUMAH YANG MEMANGGIL</small>':(s[2]?s[2]+'<br>':'')+(s[3]?'<small style="font-size:.7em;opacity:.82">'+s[3]+'</small>':'');
 clock.textContent=new Date(t*1000).toISOString().slice(14,19)+' / 01:32';
 updateCharacters(t,kind,local);windowLights.forEach(l=>l.intensity=(kind==='light'||kind==='door'||kind==='end')?18:0);porch.intensity=(kind==='light'||kind==='door'||kind==='end')?22:0;
 ghost.visible=['window','ghost','hall','end'].includes(kind);ghost.position.y=4.4+(kind==='ghost'?Math.sin(t*4)*.08:0);
 chars.forEach(c=>c.root.visible=['walk','groupfear','tio','bila','ardan','yhola','bilaardan','flashlight','ardanrun','end'].includes(kind));
 const focus=[0,1,2,3];
 if(kind==='title'){cameraAt([0,6,19],[0,4,-12],39);chars.forEach(c=>c.root.visible=false)}
 else if(kind==='village'||kind==='establish'){cameraAt([12,8,15],[0,3,-8],40)}

 else if(kind==='door'){cameraAt([0,2.8,-8],[0,2,-15],33);scene.getObjectByName('frontDoor')?.rotation.set(0,-ease(local)*.85,0)}
 else if(kind==='stairs'||kind==='hall'){cameraAt([0,4,-10],[0,4,-17],37)}
 else if(kind==='flashlight'){cameraAt([-2,3.2,7],[0,2,-13],36)}
 else if(kind==='ghost'){cameraAt([4,5.2,-8],[3.8,4.5,-14],24)}

 // camera language: push-ins, lateral tracking, crane and handheld movement
 if(['push','slowpush','tele','pov'].includes(s[5]))camera.position.lerp(new THREE.Vector3(camera.position.x,camera.position.y,camera.position.z-(s[5]==='tele'?2.2:1.1)*ease(local)),.7);
 if(s[5]==='crane')camera.position.y+=mix(1,-.5,ease(local));

window.renderFrame=renderFrame;window.setRenderResolution=(w,h)=>{renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()};
let start=0,paused=0,raf=0;
function frame(now){if(!start)start=now-paused*1000;const t=Math.min(D,(now-start)/1000);renderFrame(t);if(t>=D){paused=D;play.textContent='▶ Putar lagi';raf=0;return}raf=requestAnimationFrame(frame)}
