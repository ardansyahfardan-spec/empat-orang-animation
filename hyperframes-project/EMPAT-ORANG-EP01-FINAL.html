function makeCharacter(name,id,x,z,shirtColor,hairColor){const root=new THREE.Group();scene.add(root);root.position.set(x,0,z);const shirt=mat(shirtColor),pants=mat(0x252832),hair=mat(hairColor),skin=mat(0xb98570);

const shots=[

[25,27,'Den...','call'],
[27,32,'Tirai itu bergerak. Sesosok bayangan berdiri di balik kaca.','window'],
[32,34,'Lalu... lenyap.','empty'],
[34,37,'Jangan dijawab, Den.','erla'],
[37,41,'Pintu depannya... terbuka perlahan.','door'],
[41,47,'Dari lantai atas... terdengar langkah berat menuruni tangga. Duk... Duk... Duk...','stairs'],
[47,51,'Zio mengangkat senternya. Cahaya itu menyapu lorong...','flash'],
[51,54,'Akhirnya...','reveal'],
[54,60,'Kalian... pulang.','ending']

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),ease=v=>{v=clamp(v,0,1);return v*v*(3-2*v)};
function cameraAt(p,t,f=40){camera.position.set(...p);camera.fov=f;camera.updateProjectionMatrix();camera.lookAt(...t)}

 const groupVisible=['walk','zio','erla','ending','flash'].includes(kind);chars.forEach((c,i)=>{c.root.visible=groupVisible;const moving=kind==='walk'||kind==='ending';const phase=t*4+i*.9;c.root.position.set(c.x+(moving?Math.sin(t*.6+i*.3)*.15:0),moving?Math.abs(Math.sin(phase))*.04:0,c.z+(kind==='walk'?local*.7:0));c.legs.forEach((l,j)=>l.rotation.x=moving?Math.sin(phase+j*Math.PI)*.4:0);c.arms.forEach((a,j)=>a.rotation.x=moving?Math.sin(phase+j*Math.PI+Math.PI)*.3:0);c.head.rotation.y=0});
 if(kind==='zio'){chars[0].root.visible=true;chars[0].head.rotation.y=.18;chars.slice(1).forEach(c=>c.root.visible=true)}

 if(kind==='ending'){chars.forEach(c=>c.root.visible=true);chars.forEach(c=>c.root.position.z+=local*.25)}

 ghost.visible=kind==='window'||kind==='reveal'||kind==='ending';ghost.position.set(kind==='reveal'||kind==='ending'?1.5:4,4.6,-(kind==='reveal'?10.8:13.3));ghost.scale.setScalar(kind==='window'?.7:kind==='ending'?1.02:.88);
 flashlight.visible=kind==='flash'||kind==='reveal';beam.intensity=kind==='flash'?62:kind==='reveal'?78:0;beamTargetPosition();
 function beamTargetPosition(){target.position.set(Math.sin(t*1.8)*1.8,2,-13)}

 scene.background.set(kind==='empty'?0x05080d:0x08111b);renderer.render(scene,camera)}
function audioToDesignTime(){const duration=Number.isFinite(audio.duration)&&audio.duration>0?audio.duration:DESIGN_DURATION;return audio.currentTime/duration*DESIGN_DURATION}
function fmt(v){v=Math.max(0,Math.floor(v));return String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0')}
function sync(){const d=Number.isFinite(audio.duration)&&audio.duration>0?audio.duration:DESIGN_DURATION;const t=audio.currentTime||0;seek.max=d;seek.value=t;timeLabel.textContent=fmt(t)+' / '+fmt(d);renderDesignTime(t/d*DESIGN_DURATION)}
